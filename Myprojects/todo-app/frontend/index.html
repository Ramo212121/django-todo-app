<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Todo List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =============================== -->
    <!-- TOAST CONTAINER -->
    <!-- =============================== -->
    <div id="toast-container"></div>
    
    <!-- 🌙 DARK MODE TOGGLE -->
    <button id="theme-toggle" class="theme-toggle" title="Toggle theme">
        🌙
    </button>
    


    <!-- LIGHT THEME VIDEO -->
    <video autoplay muted loop playsinline id="bg-video-light" class="bg-video">
    <source src="background.mp4" type="video/mp4">
    </video>

    <!-- DARK THEME VIDEO -->
    <video autoplay muted loop playsinline id="bg-video-dark" class="bg-video">
    <source src="background2.mp4" type="video/mp4">
    </video>

    <div class="video-overlay"></div>


    <div class="container">

        <h1>My Todo List</h1>


        <!-- LOGIN -->
        <section id="login-section">

            <h2>Login</h2>

            <input
                type="text"
                id="username"
                placeholder="Username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button id="login-button">
                Login
            </button>

            <p id="login-message"></p>

        </section>


        <!-- REGISTER -->
        <section id="register-section">

            <h2>Register</h2>

            <input
                type="text"
                id="register-username"
                placeholder="Username"
            >

            <input
                type="email"
                id="register-email"
                placeholder="Email"
            >

            <input
                type="password"
                id="register-password"
                placeholder="Password"
            >

            <button id="register-button">
                Register
            </button>

            <p id="register-message"></p>

        </section>


        <!-- TODO SECTION -->
        <section
            id="todo-section"
            style="display: none;"
        >

            <div class="todo-input">

                <input
                    type="text"
                    id="task-title"
                    placeholder="Enter a task"
                >

                <textarea
                    id="task-description"
                    placeholder="Enter a description"
                ></textarea>

                <input
                    type="datetime-local"
                    id="task-due-date"
                >

                <select id="task-priority">

                    <option value="low">
                        Low
                    </option>

                    <option
                        value="medium"
                        selected
                    >
                        Medium
                    </option>

                    <option value="high">
                        High
                    </option>

                </select>

                <button id="add-task-button">
                    Add Task
                </button>

                <p id="task-message"></p>

            </div>


            <!-- SEARCH + FILTER -->
            <div class="filters">

                <input
                    type="text"
                    id="search-input"
                    placeholder="🔍 Search tasks..."
                >

                <select id="filter-priority">
                    <option value="">All Priorities</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>

                <select id="filter-status">
                    <option value="">All Status</option>
                    <option value="active">Not Completed</option>
                    <option value="completed">Completed</option>
                </select>

                <button id="clear-filters-button">
                    Clear
                </button>

            </div>


            <!-- Task List -->
            <div id="task-list"></div>


            <!-- Logout -->
            <button id="logout-button">
                Logout
            </button>

        </section>

    </div>


    <!-- DELETE CONFIRMATION MODAL -->
    <div id="delete-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>🗑️ Delete Task</h3>
            <p id="delete-modal-text">
                Are you sure you want to delete this task?
            </p>
            <div class="modal-actions">
                <button id="modal-cancel" class="modal-btn modal-btn-cancel">
                    Cancel
                </button>
                <button id="modal-confirm" class="modal-btn modal-btn-confirm">
                    Yes, Delete
                </button>
            </div>
        </div>
    </div>

<!-- =============================== -->
<!-- EDIT TASK MODAL -->
<!-- =============================== -->
<div id="edit-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
        <h3>✏️ Edit Task</h3>

        <label for="edit-title">Title</label>
        <input
            type="text"
            id="edit-title"
            placeholder="Task title"
        >

        <label for="edit-description">Description</label>
        <textarea
            id="edit-description"
            placeholder="Task description"
        ></textarea>

        <label for="edit-priority">Priority</label>
        <select id="edit-priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <label for="edit-due-date">Due Date</label>
        <input
            type="datetime-local"
            id="edit-due-date"
        >

        <div class="modal-actions">
            <button id="edit-cancel" class="modal-btn modal-btn-cancel">
                Cancel
            </button>
            <button id="edit-save" class="modal-btn modal-btn-confirm">
                Save
            </button>
        </div>
    </div>
</div>

    <script src="script.js"></script>

</body>

</html>
